name: Build and deploy

# Every push builds the site, so a broken build shows up as a red X on that branch.
# Only pushes to main are published to GitHub Pages (foundersillinois.org), so other branches never go live.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet, so install from package.json (versions there are pinned exactly).
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      # If the build breaks, surface the end of its output as annotations on the run summary.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          # GitHub keeps only a few annotations per step, so send the output as one multi-line message.
          msg=$(grep -v "PackFileCacheStrategy\|^<w>\|webpack\|Import trace\|autoprefixer\|^\./app/globals.css\|telemetry\|^Warning" build.log | grep -v "^\s*$" | tail -n 30 | cut -c1-200 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build output::${msg}"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
